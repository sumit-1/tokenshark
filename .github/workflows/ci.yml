name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-hf-oracles:
    name: Tests & HuggingFace Oracle Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Check for forbidden em dashes (U+2014)
        run: |
          python -c "
          import pathlib, sys
          root = pathlib.Path('.')
          skip = {'.git', '.venv', 'models', 'data', '__pycache__', '.pytest_cache', 'dist', 'build', 'tokenshark.egg-info'}
          bins = {'.png', '.gif', '.jpg', '.jpeg', '.webp', '.ico', '.safetensors', '.bin', '.pth', '.pyc', '.pdf'}
          em = chr(0x2014)
          esc = chr(92) + 'u2014'
          bad = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts) or p.suffix.lower() in bins:
                  continue
              try:
                  t = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if em in t or esc in t:
                  bad.append(str(p))
          if bad:
              print('ERROR: Em dash (U+2014) found in:', ', '.join(bad))
              sys.exit(1)
          print('OK: Zero em dashes in repository.')
          "

      - name: Install CPU PyTorch & dev/oracle dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Cache pretrained HuggingFace model for oracle tests
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-0.5b-instruct
          key: hf-oracle-model-qwen2.5-0.5b-v1

      - name: Run Model Execution vs HuggingFace Oracles (Pretrained + All Architectures)
        run: |
          pytest tests/test_oracles.py tests/test_hybrid.py tests/test_moe.py tests/test_gemma4.py tests/test_qimage.py -v --junitxml=junit-oracles.xml

      - name: Run Full Test Suite (Architecture, Features, Lab, Routes, Extensions)
        run: |
          pytest tests/test_architecture.py tests/test_features.py tests/test_lab.py tests/test_routes.py tests/test_extensions.py -v --junitxml=junit-features.xml

      - name: Publish Commit Test & Oracle Summary
        if: always()
        run: |
          python -c "
          import os, xml.etree.ElementTree as ET
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if not summary_file:
              raise SystemExit(0)
          rows = []
          total_tests = total_fail = 0
          for label, fname in [('HuggingFace Oracles (Pretrained Qwen2.5-0.5B + All Families)', 'junit-oracles.xml'),
                               ('Architecture, Features, Lab, HTTP API & Extensions', 'junit-features.xml')]:
              if not os.path.exists(fname):
                  continue
              root = ET.parse(fname).getroot()
              suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
              tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
              fails = sum(int(s.attrib.get('failures', 0)) + int(s.attrib.get('errors', 0)) for s in suites)
              skips = sum(int(s.attrib.get('skipped', 0)) for s in suites)
              secs = sum(float(s.attrib.get('time', 0.0)) for s in suites)
              total_tests += tests
              total_fail += fails
              status = 'PASSED' if fails == 0 else 'FAILED'
              rows.append(f'| {label} | **{status}** | {tests - fails - skips}/{tests} | {secs:.1f}s |')
          badge = 'PASSED' if total_fail == 0 else 'FAILED'
          sha = os.environ.get('GITHUB_SHA', '')[:7]
          with open(summary_file, 'a', encoding='utf-8') as f:
              f.write(f'## CI Test & HuggingFace Oracle Report (`{sha}`) - {badge}\n\n')
              f.write('| Suite | Status | Passed | Time |\n|---|---|---|---|\n')
              f.write('\n'.join(rows) + '\n')
          "

