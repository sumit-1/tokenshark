[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenshark"
version = "0.2.0"
description = "Open, inspect, edit, and train how open-weight language and image models compute in the browser, from pure Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Sumit", email = "ksiiitm@gmail.com" },
]
keywords = [
  "mechanistic-interpretability",
  "large-language-models",
  "diffusion-models",
  "logit-lens",
  "activation-patching",
  "steering-vectors",
  "lora",
  "ai-education",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "safetensors>=0.4",
  "tokenizers>=0.15",
  "huggingface_hub>=0.23",
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "regex>=2023.0",
  "numpy>=1.24",
  "pillow>=10.0",
  "psutil>=5.9",
  "tiktoken>=0.6",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "transformers>=4.51",
  "diffusers>=0.30",
]

[project.urls]
Homepage = "https://github.com/sumit-1/tokenshark"
Repository = "https://github.com/sumit-1/tokenshark"

[project.scripts]
tokenshark = "tokenshark.__main__:main"
tokenshark-mcp = "tokenshark.mcp_server:main"

[tool.setuptools.packages.find]
include = ["tokenshark*"]

[tool.setuptools.package-data]
tokenshark = [
  "models.json",
  "web/*",
  "web/**/*",
]
